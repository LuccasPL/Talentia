name: Application checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: node --test scripts/ai-access.test.mjs scripts/candidate-search.test.mjs scripts/contact-board.test.mjs scripts/report-presentation.test.mjs scripts/interview-invitation.test.mjs scripts/candidate-update.test.mjs scripts/pdf-import.test.mjs scripts/interview-guide.test.mjs scripts/interview-agenda.test.mjs scripts/recruitment-overview.test.mjs scripts/candidate-shortlist.test.mjs scripts/weekly-calendar.test.mjs scripts/candidate-duplicates.test.mjs scripts/candidate-batch.test.mjs
      - run: npm run build
